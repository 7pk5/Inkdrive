# Production stack for the Oracle Always Free Ampere VM.
#   cp .env.example .env   (fill it in)   then:   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecd
      POSTGRES_USER: ecd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecd -d ecd"]
      interval: 10s
      retries: 5
    # No "ports:" — the database is reachable only from the api container.

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://ecd:${POSTGRES_PASSWORD}@db:5432/ecd
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ chars)}
      DATA_KEY: ${DATA_KEY:?set DATA_KEY (openssl rand -base64 32) and back it up}
      DATA_KEY_OLD: ${DATA_KEY_OLD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}
      ALLOWED_REDIRECT_URIS: ${ALLOWED_REDIRECT_URIS:?set ALLOWED_REDIRECT_URIS}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DEV_AUTH: "0"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    # Nightly compressed dump kept for 14 days. Copy ./backups to OCI Object Storage (see README).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h db -U ecd ecd | gzip > /backups/ecd-$$(date +%F).sql.gz
          find /backups -name 'ecd-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

volumes:
  pgdata:
  caddy_data:
