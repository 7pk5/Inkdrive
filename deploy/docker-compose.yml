# Production stack for one small VM (Oracle Always Free Ampere ARM works well).
#   ./gen-secrets.sh        (once: writes .env with random secrets, mode 600)
#   docker compose up -d --build
#
# Hardening in this file:
#  - the database lives on an INTERNAL network: no route to the internet and nothing published to the host
#  - only Caddy publishes ports (80/443); the API is reachable only through it
#  - every container: no-new-privileges, dropped capabilities, resource limits; API and Caddy run read-only
#  - secrets come from .env (never baked into images), and the API refuses to start without them
name: inkdrive

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecd
      POSTGRES_USER: ecd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./gen-secrets.sh first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecd -d ecd"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://ecd:${POSTGRES_PASSWORD}@db:5432/ecd
      JWT_SECRET: ${JWT_SECRET:?run ./gen-secrets.sh first}
      DATA_KEY: ${DATA_KEY:?run ./gen-secrets.sh first, and back DATA_KEY up}
      DATA_KEY_OLD: ${DATA_KEY_OLD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}
      ALLOWED_REDIRECT_URIS: ${ALLOWED_REDIRECT_URIS:?set ALLOWED_REDIRECT_URIS}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DEV_AUTH: "0"
    networks: [internal, web] # internal: the database; web: Caddy in front, Google for sign-in checks
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 200

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 100

  # Nightly dump, compressed and ENCRYPTED with your age public key, kept 14 days in ./backups.
  # Only the holder of the matching private key (keep it OFF this server) can read a backup.
  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?set BACKUP_AGE_RECIPIENT (an age1... public key)}
    volumes:
      - ./backups:/backups
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m

networks:
  internal:
    internal: true # no route to the internet
  web: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
